[project]
name = "energy-optimizer-device-drivers"
version = "0.1.5"
description = "Device driver plugins for the Energy Optimizer home-energy dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32,<3",
    "pyserial>=3.5,<4",
]

[project.urls]
Homepage = "https://github.com/H20one/energy-optimizer-device-drivers"
"Main app" = "https://github.com/H20one/energy-optimizer"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["energy_optimizer_drivers*"]

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203"]
