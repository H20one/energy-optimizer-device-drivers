[project]
name = "ionemo-drivers"
version = "0.5.0"
description = "Device driver plugins for Ionemo, a self-hosted smart energy & home control platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32,<3",
    "pyserial>=3.5,<4",
]

[project.urls]
Homepage = "https://github.com/H20one/ionemo-drivers"
"Main app" = "https://github.com/H20one/energy-optimizer"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ionemo_drivers*"]

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203"]

[tool.coverage.report]
# Matches the 80% floor already enforced in energy-optimizer and
# energy-optimizer-email-service. Real coverage is 99% as of the sweep that
# added this gate -- set at 80 (not e.g. 95) to leave headroom for new,
# not-yet-fully-tested driver modules rather than blocking every PR on 100%.
fail_under = 80
