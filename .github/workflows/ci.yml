name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install package + dev dependencies
        run: |
          pip install --quiet -e .
          pip install --quiet -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (basedpyright)
        run: basedpyright

      - name: Contract + security compliance tests
        run: pytest tests/ -v --cov=energy_optimizer_drivers --cov-report=term-missing
